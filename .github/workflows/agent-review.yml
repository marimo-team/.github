name: Agent Review
on:
  workflow_call:
    inputs:
      policy-ref:
        description: Commit SHA on marimo-team/.github's main branch containing the review code
        required: true
        type: string
      model:
        description: The Claude model; empty uses the default
        type: string
        default: ""

permissions: {}

env:
  # Each job's Doppler config holds only the credentials that job needs: the review
  # job never sees the bot's private key, and the bot jobs never see model keys.
  DOPPLER_PROJECT: marimo-oss-bot
  DOPPLER_AGENT_CONFIG: ci_agent
  DOPPLER_AGENT_IDENTITY: TODO-doppler-agent-identity-id
  DOPPLER_BOT_CONFIG: ci_bot
  DOPPLER_BOT_IDENTITY: TODO-doppler-bot-identity-id
  BOT_CLIENT_ID: Iv23lisN9yMRNSc7wovY # marimo-oss-bot (App ID 3225607)
  DENO_VERSION: v2.9.8
  WORK_DIR: _agent_review
  CENTRAL_DIR: _agent_review/central
  HEAD_DIR: pr-head
  SCHEMA_FILE: _agent_review/schema.json
  RESULT_FILE: _agent_review/result.json
  REPOSITORY: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  REQUESTER: ${{ github.event.sender.login }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  POLICY_MODEL: ${{ inputs.model }}

jobs:
  start:
    name: Start
    if: >-
      github.repository_owner == 'marimo-team' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review'
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    # GitHub's OIDC tokens are the same for every job in a run, except for the
    # environment. The bot's Doppler identity trusts only this environment's subject,
    # so the review job can't fetch the bot key even if the agent obtains a token.
    # Both environments allow only the default branch, so branch workflows can't use them.
    environment:
      name: agent-bot
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Doppler OIDC
    outputs:
      comment-id: ${{ steps.progress.outputs.comment-id }}
    steps:
      - name: Check policy ref
        env:
          POLICY_REF: ${{ inputs.policy-ref }}
        run: '[[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a policy commit SHA"; exit 1; }'
      - name: Check out review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marimo-team/.github
          ref: ${{ inputs.policy-ref }}
          path: ${{ env.CENTRAL_DIR }}
          sparse-checkout: agent-review
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Authorize
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_REF: ${{ inputs.policy-ref }}
        run: deno run --no-prompt --allow-net=api.github.com --allow-env steps/authorize.ts
      # The checkout above is policy-ref. `$/` would avoid the checkout, but actionlint
      # doesn't support it yet (rhysd/actionlint#711). A local path can't use env.
      - name: Mint bot token
        id: bot
        uses: ./_agent_review/central/agent-review/bot-token # zizmor: ignore[self-repository]
        with:
          doppler-identity: ${{ env.DOPPLER_BOT_IDENTITY }}
          doppler-project: ${{ env.DOPPLER_PROJECT }}
          doppler-config: ${{ env.DOPPLER_BOT_CONFIG }}
          client-id: ${{ env.BOT_CLIENT_ID }}
      - name: Post progress comment
        id: progress
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
        run: deno run --no-prompt --allow-net=api.github.com --allow-env --allow-write="$GITHUB_OUTPUT" steps/start.ts

  review:
    name: Review
    needs: start
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    timeout-minutes: 30
    # The model credentials' Doppler identity trusts only this environment's subject.
    environment:
      name: agent
      deployment: false
    # No write access: the agent reads untrusted PR content in this job.
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Doppler OIDC
    steps:
      # The workspace root is the trusted base branch. The PR head is checked out
      # beside it only as files to read; no step in this workflow executes it.
      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Check out PR head as review material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ${{ env.HEAD_DIR }}
          persist-credentials: false
      - name: Check out review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marimo-team/.github
          ref: ${{ inputs.policy-ref }}
          path: ${{ env.CENTRAL_DIR }}
          sparse-checkout: agent-review
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Prepare review
        id: prepare
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          deno run --no-prompt --allow-net=api.github.com --allow-env
          --allow-read="$GITHUB_WORKSPACE" --allow-write="$GITHUB_WORKSPACE/$WORK_DIR,$GITHUB_OUTPUT"
          steps/prepare.ts
      - name: Fetch model credentials
        id: model-secrets
        uses: dopplerhq/secrets-fetch-action@cd2efbf9a404504316435873eff298b82f7e0562 # v1.3.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.DOPPLER_AGENT_IDENTITY }}
          doppler-project: ${{ env.DOPPLER_PROJECT }}
          doppler-config: ${{ env.DOPPLER_AGENT_CONFIG }}
      # `--tools` removes every built-in tool except reading. No allow rules are added:
      # in `dontAsk` mode reads inside the workspace proceed and anything else, such as
      # reading `/proc` for the action's environment, is denied instead of prompted.
      # claude-code-action writes the job's token into the workspace's `.git/config`, so
      # reads of `.git` are denied. `--strict-mcp-config` ignores the repository's MCP servers.
      - name: Build Claude arguments
        id: args
        env:
          MODEL: ${{ steps.prepare.outputs.model }}
        run: |
          schema=$(jq -c . "$SCHEMA_FILE")
          # The action parses claude_args with shell-quote; the schema is single-quoted.
          if [[ $schema == *"'"* ]]; then
            echo "::error::The output schema can't contain single quotes"
            exit 1
          fi
          args="--model $MODEL --tools Read,Grep,Glob --disallowedTools 'Read(**/.git/**)'"
          args+=" --permission-mode dontAsk --strict-mcp-config --max-turns 100"
          args+=" --json-schema '$schema'"
          delimiter="EOF_$(openssl rand -hex 16)"
          printf 'value<<%s\n%s\n%s\n' "$delimiter" "$args" "$delimiter" >> "$GITHUB_OUTPUT"
      - name: Review
        id: claude
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        env:
          # Nested CLAUDE.md files under the PR head would otherwise load as instructions.
          CLAUDE_CODE_DISABLE_CLAUDE_MDS: "1"
          # The conversation goes to an OTLP backend rather than the public job log. Claude
          # can't read its environment, so the headers' token stays out of the agent's reach.
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ steps.model-secrets.outputs.OTLP_ENDPOINT != '' && '1' || '0' }}
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
          OTEL_LOGS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          OTEL_METRICS_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ steps.model-secrets.outputs.OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ steps.model-secrets.outputs.OTLP_HEADERS }}
          OTEL_RESOURCE_ATTRIBUTES: >-
            service.name=agent-review,github.repository=${{ github.repository }},github.pr=${{ github.event.pull_request.number }},github.run_id=${{ github.run_id }},github.run_attempt=${{ github.run_attempt }}
          OTEL_LOG_USER_PROMPTS: "1"
          OTEL_LOG_ASSISTANT_RESPONSES: "1"
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_LOG_TOOL_CONTENT: "1"
        with:
          claude_code_oauth_token: ${{ steps.model-secrets.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action exchanges the OIDC token for a Claude App token
          # with write access.
          github_token: ${{ github.token }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          claude_args: ${{ steps.args.outputs.value }}
      # Read from the transcript file: an environment variable can't hold more than 128 KiB.
      - name: Save output
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -ce '[.[] | select(.type == "result")] | last | .structured_output // empty' "$EXECUTION_FILE" > "$RESULT_FILE"
      - name: Check result
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          RESULT_PATH: ${{ github.workspace }}/${{ env.RESULT_FILE }}
        run: >-
          deno run --no-prompt --allow-env --allow-read="$GITHUB_WORKSPACE"
          --allow-write="$GITHUB_WORKSPACE/$WORK_DIR" steps/check-output.ts
      - name: Upload result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-review-result
          path: ${{ env.RESULT_FILE }}
          if-no-files-found: error
          overwrite: true # a re-run attempt reuses the name
          retention-days: 7

  publish:
    name: Publish
    needs: [start, review]
    if: always() && needs.start.result == 'success'
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    environment:
      name: agent-bot
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Doppler OIDC
    steps:
      - name: Check out review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marimo-team/.github
          ref: ${{ inputs.policy-ref }}
          path: ${{ env.CENTRAL_DIR }}
          sparse-checkout: agent-review
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      # A missing result, such as an expired artifact on a re-run, is reported by publish.
      - name: Download result
        if: needs.review.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-review-result
          path: ${{ runner.temp }}/agent-review-result
      - name: Mint bot token
        id: bot
        uses: ./_agent_review/central/agent-review/bot-token # zizmor: ignore[self-repository]
        with:
          doppler-identity: ${{ env.DOPPLER_BOT_IDENTITY }}
          doppler-project: ${{ env.DOPPLER_PROJECT }}
          doppler-config: ${{ env.DOPPLER_BOT_CONFIG }}
          client-id: ${{ env.BOT_CLIENT_ID }}
          pull-requests: write
      - name: Publish review
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.bot.outputs.token }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
          RESULT_PATH: ${{ runner.temp }}/agent-review-result/result.json
          COMMENT_ID: ${{ needs.start.outputs.comment-id }}
        run: deno run --no-prompt --allow-net=api.github.com --allow-env --allow-read="$RUNNER_TEMP" steps/publish.ts
