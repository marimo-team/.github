name: Agent Review CI
on:
  pull_request:
    paths:
      - agent-review/**
      - .github/workflows/agent-review*.yml
  push:
    branches: [main]
    paths:
      - agent-review/**
      - .github/workflows/agent-review*.yml

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/ steps/
      - run: deno test --no-prompt src/
