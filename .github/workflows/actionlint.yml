name: Actionlint
on:
  workflow_call:
    inputs:
      policy-ref:
        description: Commit SHA in marimo-team/.github containing the shared config
        required: true
        type: string
      allow-concurrency-queue:
        description: Allow the GitHub concurrency.queue key unsupported by actionlint v1.7.12
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  lint:
    name: actionlint
    # Honor each caller's approved runner pool; public and private pools differ.
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download shared config
        env:
          POLICY_REF: ${{ inputs.policy-ref }}
        run: |
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a policy commit SHA'; exit 1; }
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/marimo-team/.github/$POLICY_REF/.github/actionlint.yaml" \
            --output "$RUNNER_TEMP/actionlint.yaml"
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        # No repository scripts are executed. ShellCheck checks embedded shell code.
        env:
          ALLOW_CONCURRENCY_QUEUE: ${{ inputs.allow-concurrency-queue }}
        run: |
          args=(-color -config-file "$RUNNER_TEMP/actionlint.yaml" -pyflakes="")
          if [[ "$ALLOW_CONCURRENCY_QUEUE" == 'true' ]]; then
            # Remove this compatibility exception when upstream supports concurrency.queue.
            args+=(-ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$')
          fi
          "$RUNNER_TEMP/actionlint" "${args[@]}"
