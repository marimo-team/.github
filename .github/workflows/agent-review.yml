name: Agent Review
on:
  workflow_call:
    inputs:
      policy-ref:
        description: Commit SHA in marimo-team/.github containing the review code
        required: true
        type: string
      allow-approve:
        description: Let the bot approve; otherwise it only requests changes or comments
        type: boolean
        default: false
      harness:
        description: claude or codex
        type: string
        default: claude
      model:
        description: The harness's model; empty uses the default
        type: string
        default: ""
      block-at-severity:
        description: Findings at or above this severity request changes
        type: string
        default: high
      never-auto-approve:
        description: Globs, one per line, that always need a human approval, on top of the defaults
        type: string
        default: ""
      max-changed-lines:
        description: Larger PRs are never approved
        type: number
        default: 400

permissions: {}

env:
  # Each job's Doppler config holds only the credentials that job needs: the review
  # job never sees the bot's private key, and the bot jobs never see model keys.
  DOPPLER_PROJECT: marimo-oss-bot
  DOPPLER_AGENT_CONFIG: ci_agent
  DOPPLER_AGENT_IDENTITY: TODO-doppler-agent-identity-id
  DOPPLER_BOT_CONFIG: ci_bot
  DOPPLER_BOT_IDENTITY: TODO-doppler-bot-identity-id
  BOT_CLIENT_ID: Iv23lisN9yMRNSc7wovY # marimo-oss-bot (App ID 3225607)
  WORK_DIR: _agent_review
  CENTRAL_DIR: _agent_review/central
  HEAD_DIR: pr-head
  REPOSITORY: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  REQUESTER: ${{ github.event.sender.login }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  POLICY_ALLOW_APPROVE: ${{ inputs.allow-approve }}
  POLICY_HARNESS: ${{ inputs.harness }}
  POLICY_MODEL: ${{ inputs.model }}
  POLICY_BLOCK_AT_SEVERITY: ${{ inputs.block-at-severity }}
  POLICY_NEVER_AUTO_APPROVE: ${{ inputs.never-auto-approve }}
  POLICY_MAX_CHANGED_LINES: ${{ inputs.max-changed-lines }}

jobs:
  start:
    name: Start
    if: >-
      github.repository_owner == 'marimo-team' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review'
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    # GitHub's OIDC tokens are the same for every job in a run, except for the
    # environment. The bot's Doppler identity trusts only this environment's subject,
    # so the review job can't fetch the bot key even if the agent obtains a token.
    # Both environments allow only the default branch, so branch workflows can't use them.
    environment:
      name: agent-bot
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Doppler OIDC
    outputs:
      comment-id: ${{ steps.progress.outputs.comment-id }}
    steps:
      - name: Check policy ref
        env:
          POLICY_REF: ${{ inputs.policy-ref }}
        run: '[[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a policy commit SHA"; exit 1; }'
      - name: Check out review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marimo-team/.github
          ref: ${{ inputs.policy-ref }}
          path: ${{ env.CENTRAL_DIR }}
          sparse-checkout: agent-review
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Authorize
        id: authorize
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deno run --no-prompt --allow-net=api.github.com --allow-env steps/authorize.ts
      - name: Fetch bot credentials
        id: bot-secrets
        uses: dopplerhq/secrets-fetch-action@cd2efbf9a404504316435873eff298b82f7e0562 # v1.3.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.DOPPLER_BOT_IDENTITY }}
          doppler-project: ${{ env.DOPPLER_PROJECT }}
          doppler-config: ${{ env.DOPPLER_BOT_CONFIG }}
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.BOT_CLIENT_ID }}
          private-key: ${{ steps.bot-secrets.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write # the progress comment and reaction
      - name: Post progress comment
        id: progress
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: deno run --no-prompt --allow-net=api.github.com --allow-env --allow-write="$GITHUB_OUTPUT" steps/start.ts

  review:
    name: Review
    needs: start
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    timeout-minutes: 30
    # The model credentials' Doppler identity trusts only this environment's subject.
    environment:
      name: agent
      deployment: false
    # No write access: the agent reads untrusted PR content in this job.
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Doppler OIDC
    steps:
      # The workspace root is the trusted base branch. The PR head is checked out
      # beside it only as files to read; no step in this workflow executes it.
      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Check out PR head as review material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ${{ env.HEAD_DIR }}
          persist-credentials: false
      - name: Check out review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marimo-team/.github
          ref: ${{ inputs.policy-ref }}
          path: ${{ env.CENTRAL_DIR }}
          sparse-checkout: agent-review
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Prepare review
        id: prepare
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          deno run --no-prompt --allow-net=api.github.com --allow-env
          --allow-read="$GITHUB_WORKSPACE" --allow-write="$GITHUB_WORKSPACE/$WORK_DIR,$GITHUB_OUTPUT"
          steps/prepare.ts
      - name: Fetch model credentials
        id: model-secrets
        uses: dopplerhq/secrets-fetch-action@cd2efbf9a404504316435873eff298b82f7e0562 # v1.3.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.DOPPLER_AGENT_IDENTITY }}
          doppler-project: ${{ env.DOPPLER_PROJECT }}
          doppler-config: ${{ env.DOPPLER_AGENT_CONFIG }}
      # The checkout above is policy-ref. `$/` would avoid the checkout, but actionlint
      # doesn't support it yet (rhysd/actionlint#711). A local path can't use env.
      - name: Review
        uses: ./_agent_review/central/agent-review/run-agent # zizmor: ignore[self-repository]
        with:
          harness: ${{ steps.prepare.outputs.harness }}
          model: ${{ steps.prepare.outputs.model }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          claude-args: ${{ steps.prepare.outputs.claude-args }}
          schema-file: ${{ env.WORK_DIR }}/schema.json
          output-file: ${{ env.WORK_DIR }}/result.json
          claude-code-oauth-token: ${{ steps.model-secrets.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          openai-api-key: ${{ steps.model-secrets.outputs.OPENAI_API_KEY }}
          otlp-endpoint: ${{ steps.model-secrets.outputs.OTLP_ENDPOINT }}
          otlp-headers: ${{ steps.model-secrets.outputs.OTLP_HEADERS }}
      - name: Check result
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          OUTPUT_PATH: ${{ github.workspace }}/${{ env.WORK_DIR }}/result.json
        run: >-
          deno run --no-prompt --allow-env --allow-read="$GITHUB_WORKSPACE"
          --allow-write="$GITHUB_WORKSPACE/$WORK_DIR" steps/check-output.ts
      - name: Upload result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-review-result
          path: ${{ env.WORK_DIR }}/result.json
          if-no-files-found: error
          overwrite: true # a re-run attempt reuses the name
          retention-days: 7

  publish:
    name: Publish
    needs: [start, review]
    if: always() && needs.start.result == 'success'
    runs-on: ${{ vars.CI_RUNNER_SMALL || (github.event.repository.private && 'ubuntu-small' || 'ubuntu-p-small') }}
    environment:
      name: agent-bot
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Doppler OIDC
    steps:
      - name: Check out review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marimo-team/.github
          ref: ${{ inputs.policy-ref }}
          path: ${{ env.CENTRAL_DIR }}
          sparse-checkout: agent-review
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Download result
        if: needs.review.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-review-result
          path: ${{ runner.temp }}/agent-review-result
      - name: Fetch bot credentials
        id: bot-secrets
        uses: dopplerhq/secrets-fetch-action@cd2efbf9a404504316435873eff298b82f7e0562 # v1.3.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.DOPPLER_BOT_IDENTITY }}
          doppler-project: ${{ env.DOPPLER_PROJECT }}
          doppler-config: ${{ env.DOPPLER_BOT_CONFIG }}
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.BOT_CLIENT_ID }}
          private-key: ${{ steps.bot-secrets.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
      - name: Publish review
        working-directory: ${{ env.CENTRAL_DIR }}/agent-review
        env:
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.bot-token.outputs.token }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
          RESULT_PATH: ${{ runner.temp }}/agent-review-result/result.json
          COMMENT_ID: ${{ needs.start.outputs.comment-id }}
        run: deno run --no-prompt --allow-net=api.github.com --allow-env --allow-read="$RUNNER_TEMP" steps/publish.ts
